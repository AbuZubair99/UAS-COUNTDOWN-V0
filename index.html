<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAS Countdown</title>
  
  <!-- Google Fonts: Orbitron & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #191919; /* Notion Dark Mode theme */
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container dengan flex centering */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100%;
      max-width: 1000px;
      padding: 15px 2%;
      box-sizing: border-box;
    }

    /* Title dihitung presisi sejajar tepi luar lingkaran */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.2rem, 4.5cqi + 0.5rem, 2.5rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 166, 0, 0.45);
      width: 100%;
      margin-top: 0;
      margin-left: clamp(18px, 2.8%, 32px);
      margin-bottom: 20px;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* Grid layout flexbox yang elastis */
    .countdown-grid {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 2%;
    }

    .circle-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 0px;
      min-width: 0;
    }

    .circle-wrapper {
      position: relative;
      width: 100%;
      max-width: 180px;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* SVG Canvas skalabel */
    .circle-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .circle-bg {
      fill: none;
      stroke: #2a2a2a;
      stroke-width: 6;
    }

    .circle-progress {
      fill: none;
      stroke: #ffa600;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s linear;
      filter: drop-shadow(0 0 8px rgba(255, 166, 0, 0.8));
    }

    /* Ukuran angka diperkecil agar pas dan proporsional */
    .number {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.75rem, 4.2cqi, 2.2rem); /* Diperkecil dari rentang sebelumnya */
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 166, 0, 0.55);
      text-align: center;
    }

    /* Teks label dinamis */
    .label {
      margin-top: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.5rem, 2.2cqi, 1rem);
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 166, 0, 0.4);
      text-align: center;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .title {
        margin-left: 14px;
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">UAS COUNTDOWN</h1>
    
    <div class="countdown-grid">
      
      <!-- Days Unit -->
      <div class="circle-item">
        <div class="circle-wrapper">
          <svg class="circle-svg" viewBox="0 0 100 100">
            <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
            <circle class="circle-progress" id="ring-days" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="0"></circle>
          </svg>
          <span class="number" id="days">00</span>
        </div>
        <span class="label">Days</span>
      </div>

      <!-- Hours Unit -->
      <div class="circle-item">
        <div class="circle-wrapper">
          <svg class="circle-svg" viewBox="0 0 100 100">
            <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
            <circle class="circle-progress" id="ring-hours" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="0"></circle>
          </svg>
          <span class="number" id="hours">00</span>
        </div>
        <span class="label">Hours</span>
      </div>

      <!-- Minutes Unit -->
      <div class="circle-item">
        <div class="circle-wrapper">
          <svg class="circle-svg" viewBox="0 0 100 100">
            <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
            <circle class="circle-progress" id="ring-minutes" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="0"></circle>
          </svg>
          <span class="number" id="minutes">00</span>
        </div>
        <span class="label">Minutes</span>
      </div>

      <!-- Seconds Unit -->
      <div class="circle-item">
        <div class="circle-wrapper">
          <svg class="circle-svg" viewBox="0 0 100 100">
            <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
            <circle class="circle-progress" id="ring-seconds" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="0"></circle>
          </svg>
          <span class="number" id="seconds">00</span>
        </div>
        <span class="label">Seconds</span>
      </div>

    </div>
  </div>

  <script>
    // Target UAS Date
    const targetDate = new Date("2026-11-28T00:00:00+07:00").getTime();
    const circumference = 2 * Math.PI * 40;

    function updateProgress(id, value, max) {
      const circle = document.getElementById(id);
      if (!circle) return;
      const offset = circumference - (value / max) * circumference;
      circle.style.strokeDashoffset = offset;
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.querySelector(".container").innerHTML = "<h1 class='title'>UAS DILAKSANAKAN!</h1>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

      updateProgress("ring-days", days % 365, 365);
      updateProgress("ring-hours", hours, 24);
      updateProgress("ring-minutes", minutes, 60);
      updateProgress("ring-seconds", seconds, 60);
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
