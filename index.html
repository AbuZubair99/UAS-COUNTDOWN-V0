<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAS Countdown</title>
  
  <!-- Google Fonts: Orbitron & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #191919; /* Notion Dark Mode theme */
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      padding: 0 10px; /* Dikurangi dari 10px atas-bawah menjadi 0 */
    }

    /* Outer wrapper containing title & grid centered on screen */
    .container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      padding: 5px 0; /* Dikurangi dari 15px 5px menjadi 5px 0 */
    }

    /* Title aligned precisely */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.4rem, 5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px; /* Dikurangi dari 20px menjadi 10px */
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 166, 0, 0.45);
      align-self: flex-start;
      width: 100%;
      word-wrap: break-word;
    }

    /* Grid layout for 4 circular countdown items */
    .countdown-grid {
      display: flex;
      gap: clamp(8px, 2vw, 25px);
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .circle-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 0; /* Mencegah flex item meluap/overflow */
      max-width: 180px;
    }

    .circle-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }

    /* SVG Canvas setup */
    .circle-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .circle-bg {
      fill: none;
      stroke: #2a2a2a;
      stroke-width: 6;
    }

    /* Animated circular progress indicator */
    .circle-progress {
      fill: none;
      stroke: #ffa600;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s linear;
      filter: drop-shadow(0 0 8px rgba(255, 166, 0, 0.8));
    }

    /* Prominent numeric readout */
    .number {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.1rem, 4vw, 3.4rem);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 166, 0, 0.55);
      text-align: center;
    }

    /* Label text */
    .label {
      margin-top: 6px; /* Dikurangi dari 8px menjadi 6px */
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.55rem, 1.8vw, 1.05rem);
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 166, 0, 0.4);
      text-align: center;
      white-space: nowrap;
    }

    /* Penyesuaian khusus jarak ringkas untuk Layar HP */
    @media (max-width: 480px) {
      body {
        min-height: auto; /* Mencegah body mengambil tinggi layar penuh jika di-embed di Notion */
        padding: 0;
      }
      .container {
        padding: 2px 0; /* Padding atas & bawah sangat minim untuk HP */
      }
      .title {
        letter-spacing: 1.5px;
        margin-bottom: 8px; /* Jarak judul ke lingkaran diperketat */
      }
      .countdown-grid {
        gap: 6px;
      }
      .circle-bg, .circle-progress {
        stroke-width: 7;
      }
      .label {
        letter-spacing: 0.5px;
        margin-top: 4px; /* Jarak lingkaran ke label teks diperketat */
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">UAS COUNTDOWN</h1>
    
    <div class="countdown-grid">
      
      <!-- Days Unit -->
      <div class="circle-item">
        <div class="circle-wrapper">
          <svg class="circle-svg" viewBox="0 0 100 100">
            <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
            <circle class="circle-progress" id="ring-days" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="0"></circle>
          </svg>
          <span class="number" id="days">00</span>
        </div>
        <span class="label">Days</span>
      </div>

      <!-- Hours Unit -->
      <div class="circle-item">
        <div class="circle-wrapper">
          <svg class="circle-svg" viewBox="0 0 100 100">
            <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
            <circle class="circle-progress" id="ring-hours" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="0"></circle>
          </svg>
          <span class="number" id="hours">00</span>
        </div>
        <span class="label">Hours</span>
      </div>

      <!-- Minutes Unit -->
      <div class="circle-item">
        <div class="circle-wrapper">
          <svg class="circle-svg" viewBox="0 0 100 100">
            <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
            <circle class="circle-progress" id="ring-minutes" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="0"></circle>
          </svg>
          <span class="number" id="minutes">00</span>
        </div>
        <span class="label">Minutes</span>
      </div>

      <!-- Seconds Unit -->
      <div class="circle-item">
        <div class="circle-wrapper">
          <svg class="circle-svg" viewBox="0 0 100 100">
            <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
            <circle class="circle-progress" id="ring-seconds" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="0"></circle>
          </svg>
          <span class="number" id="seconds">00</span>
        </div>
        <span class="label">Seconds</span>
      </div>

    </div>
  </div>

  <script>
    // Target UAS Date
    const targetDate = new Date("2026-11-28T00:00:00+07:00").getTime();
    const circumference = 2 * Math.PI * 40; // Approx 251.33px radius perimeter

    /**
     * Updates strokeDashoffset for SVG rings smoothly
     */
    function updateProgress(id, value, max) {
      const circle = document.getElementById(id);
      if (!circle) return;
      const offset = circumference - (value / max) * circumference;
      circle.style.strokeDashoffset = offset;
    }

    /**
     * Main timer update routine
     */
    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.querySelector(".container").innerHTML = "<h1 class='title'>UAS DILAKSANAKAN!</h1>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

      // Update progress stroke rings dynamically
      updateProgress("ring-days", days % 365, 365);
      updateProgress("ring-hours", hours, 24);
      updateProgress("ring-minutes", minutes, 60);
      updateProgress("ring-seconds", seconds, 60);
    }

    // Refresh every second
    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
